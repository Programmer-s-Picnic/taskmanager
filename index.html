
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SuperStar Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <h1 class="logo-title">
        <img src="designpics/icon.jpg" alt="Logo" class="logo">
        <span>SuperStar Task Manager</span>
    </h1>

    <div class="search-box">
        <input type="search" name="search" placeholder="Search tasks...">
    </div>

    <nav class="header-buttons">
        <a href="task_entry/index.html" class="nav-btn">Task Entry</a>

        <a href="all_task/index.html" class="nav-btn">All Task</a>

        <button type="button" class="logout-btn">Logout</button>
    </nav>
</header>


    <main class="container">

        <section class="task-section">
            <h2>My Tasks</h2>

            <div class="date-box">
                <label for="task-date">Select Date</label>
                <input type="date" id="task-date" name="date">
            </div>

            <div class="today-task">
                <h2>Today Tasks</h2>

                <div class="task-navigation">
                    <button type="button" class="arrow-btn" id="prevTask">
                        &#8592;
                    </button>

                    <button type="button" class="arrow-btn" id="nextTask">
                        &#8594;
                    </button>
                </div>

                <div class="today-task-content">
                    <!-- Today's tasks yahan dikhenge -->
                </div>
            </div>

            <div class="task-card">
                <h3>Upcoming Tasks</h3>
                <p>Your upcoming tasks will appear here.</p>
            </div>
        </section>

        <section class="calendar-section">
            <h2>Calendar</h2>

            <div class="real-calendar">
                <label for="calendar-date">Select Calendar Date</label>

                <input
                    type="date"
                    id="calendar-date"
                    name="calendar-date"
                >

                <p>Select a date using the calendar.</p>
            </div>

        </section>

    </main>

</body>

</html>
