<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Entry</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


<div class="task-page">

    <div class="task-card">

        <div class="task-header">
            <div class="task-icon">✓</div>
            <h1>Task Entry</h1>
            <p>Plan your work. Achieve your goals.</p>
        </div>

        <form>
            <div class="form-group">
            <label for="taskName">Task Name</label>
            <input type="text" id="taskName" name="TaskName"placeholder="Enter your task name" required />
            </div>

            <div class="form-group">
            <label for="taskDate">Date &amp; Time</label>
            <input type="datetime-local" id="taskDate" name="TaskDate" required />
            </div>

            <div class="form-group">
            <label for="taskDetails">Task Details</label>
            <textarea id="taskDetails" name="TaskDetails" placeholder="Describe your task..." rows="4"></textarea>
            </div>

            <div class="form-group">
                <label for="taskStatus">Task Status</label>
                <select id="taskStatus" name="TaskStatus">
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
                </select>
            </div>

            <div class="button-group">
            <button type="submit" class="btn-submit">✓ Submit Task</button>
            <button type="reset" class="btn-clear">↻ Clear Form</button>
            </div>
        </form>

        <p class="footer-text">Stay focused. One task at a time. ✨</p>

    </div>
</div>
    
</body>
</html>
